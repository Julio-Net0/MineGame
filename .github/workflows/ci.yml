name: CI

# Path filters are deliberately safe here: GitHub does not evaluate them for tag
# pushes, so a v* tag still builds even when its commit only touched docs.
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Only the release job (added later) needs write access; builds stay read-only.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build (Linux)
    # Pinned rather than ubuntu-latest: the runner image decides the glibc floor
    # of the released binary, so it must move deliberately, not silently.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # raylib is compiled from source through FetchContent, so its X11, OpenGL,
      # ALSA and Wayland headers must exist before CMake configures.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      # Keyed on CMakeLists.txt, which is where the raylib revision is declared.
      # The prefix restore-key keeps the cache useful when only the source list
      # changes; FetchContent re-clones by itself if the pinned tag differs.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      # The build tree is already the shipping layout: CMake's POST_BUILD step
      # mirrors assets/ next to the executable, so packaging is a straight copy.
      # Everything lives under one top-level directory so extracting does not
      # scatter files across the user's download folder.
      - name: Package
        run: |
          STAGE=dist/MineGame-linux-x86_64
          mkdir -p "$STAGE"
          cp build/MineGame "$STAGE/"
          cp -r build/assets "$STAGE/assets"
          (cd dist && zip -r MineGame-linux-x86_64.zip MineGame-linux-x86_64)

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MineGame-linux-x86_64
          path: dist/MineGame-linux-x86_64.zip
          if-no-files-found: error

  lint:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version-pinned on purpose: an unpinned clang-tidy gains checks over time
      # and would fail a build with no source change. 19 is the oldest release
      # carrying --exclude-header-filter, which is what keeps vendored code out.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            clang-tidy-19 \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      # Separate key from build-linux: this job only populates the dependency
      # sources, so sharing a key would let a half-built tree poison that cache.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-lint-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-lint-

      # Configure alone emits compile_commands.json and populates the raylib
      # headers the analysis needs; no compilation step is required.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # The header filter is anchored at the checkout's own src/ so raylib's
      # headers, which also live under a directory named src/, stay out of the
      # report; third-party sources vendored inside src/ are excluded explicitly.
      # The project rules forbid NOLINT, so any diagnostic must be fixed, and
      # every warning is promoted to an error to enforce that.
      # Output is buffered rather than streamed: clang-tidy prints a per-file
      # "N warnings generated" tally that counts diagnostics the header filter
      # suppressed, so a clean run still scrolls past thousands of raylib
      # warnings that were never reported. Only a failing run prints anything.
      - name: Run Clang-Tidy
        run: |
          mapfile -t SOURCES < <(find src -name '*.c' -not -path 'src/third_party/*' | sort)
          printf 'Analysing %d translation units\n' "${#SOURCES[@]}"
          if clang-tidy-19 -p build --quiet \
               --header-filter="^${GITHUB_WORKSPACE}/src/" \
               --exclude-header-filter=".*/src/third_party/.*" \
               --warnings-as-errors='*' \
               "${SOURCES[@]}" > clang-tidy.log 2>&1; then
            echo 'Clang-Tidy: clean'
          else
            grep -v -e 'warnings generated' -e 'Processing file' clang-tidy.log
            exit 1
          fi

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MSVC cannot build this project: the engine uses POSIX threads and GCC
      # function attributes. MSYS2 also matches the toolchain BuildAndRun.ps1
      # uses locally, so a red CI run reproduces on the maintainer's machine.
      # cache: true freezes the resolved package set between runs, since MSYS2
      # itself is a rolling distribution with no per-package pinning.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-windows-

      # -static is what makes the archive self-contained: MinGW otherwise links
      # libwinpthread and libgcc as DLLs, which a player's machine will not have.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_EXE_LINKER_FLAGS=-static

      - name: Build
        run: cmake --build build

      - name: Verify no toolchain DLL dependencies
        run: |
          objdump -p build/MineGame.exe | grep 'DLL Name' | sort
          if objdump -p build/MineGame.exe | grep -qiE 'lib(gcc|winpthread|stdc\+\+)'; then
            echo 'Binary links a MinGW runtime DLL that players will not have.'
            exit 1
          fi

      - name: Package
        run: |
          STAGE=dist/MineGame-windows-x86_64
          mkdir -p "$STAGE"
          cp build/MineGame.exe "$STAGE/"
          cp -r build/assets "$STAGE/assets"
          (cd dist && zip -r MineGame-windows-x86_64.zip MineGame-windows-x86_64)

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MineGame-windows-x86_64
          path: dist/MineGame-windows-x86_64.zip
          if-no-files-found: error
